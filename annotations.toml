# The same, for a member of an interface rather than a property of a profile. `AccessPoint.Ssid`
# is the network an access point announces, and is the byte string `802-11-wireless.ssid` is
# matched against, so the two say so the same way.
[[newtype]]
interface = "org.freedesktop.NetworkManager.AccessPoint"
name = "Ssid"
type = "Ssid"

# `VersionInfo` packs two different things into one array — NetworkManager's own version, then a
# bitfield of capabilities — even though its prose names only `NMVersionInfoCapability`, exactly
# as `Capabilities` names `NMCapability` for an array that really is uniformly that type. Naming
# it here, rather than leaving it to inference, decodes both correctly instead of either failing
# to apply or misreading the version as more capability bits.
[[newtype]]
interface = "org.freedesktop.NetworkManager"
name = "VersionInfo"
type = "VersionInfo"

# The options dictionary of `AddAndActivateConnection2`, whose two keys NetworkManager
# documents in the method's own prose. Unlike the read-only dictionaries above this one is
# written, so a key typed wrongly here would be a rejected call rather than a decode error —
# which is why it is only the keys upstream spells out, with anything else kept in `other`.

[[enumeration]]
name = "ActivationPersist"
doc = "How long a connection added by `AddAndActivateConnection2` should last."
[[enumeration.value]]
value = "disk"
doc = "Save it, as any other profile. The default."
[[enumeration.value]]
value = "memory"
doc = "Do not save it to disk."
[[enumeration.value]]
value = "volatile"
doc = "Do not save it to disk, and destroy it when it disconnects."

[[enumeration]]
name = "ActivationBinding"
doc = "What the lifetime of an activation is tied to."
[[enumeration.value]]
value = "none"
doc = "Nothing: the connection stays activated normally. The default."
[[enumeration.value]]
name = "DbusClient"
value = "dbus-client"
doc = "The requesting process, disconnecting when it leaves the bus."

[[vardict]]
name = "ActivationOptions"
doc = "Further options for `AddAndActivateConnection2`."
applies = [
    "org.freedesktop.NetworkManager.AddAndActivateConnection2.options",
]
keys = [
    { name = "persist", type = "ActivationPersist", doc = "How long the new connection should last." },
    { name = "bind-activation", type = "ActivationBinding", doc = "What to tie the activation's lifetime to." },
]

