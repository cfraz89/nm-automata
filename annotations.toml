# Type annotations that cannot be read out of the vendored spec.
#
# Generation will type a property or argument as one of NetworkManager's enumerations by
# parsing the documentation — through a `Returns:` line, an `@argument` entry, or a mention in
# the prose — or by reading it off the corresponding getter in NM-1.0.gir, where that is typed
# more precisely than the property itself. A hand-written wrapper below always wins where one is
# named for the same member, since prose can be wrong about an array in a way it cannot about a
# single value: `VersionInfo` names `NMVersionInfoCapability` exactly as `Capabilities` names
# `NMCapability`, yet only the second is uniformly that type across the whole array. What is
# left over after all of that goes here.
#
# Every entry is checked: the named type must exist in the vendored headers, and the annotated
# member must exist with a matching D-Bus signature. An entry that no longer applies fails
# generation, so this file cannot rot silently as NetworkManager changes.

# Two settings are named so that neither the name NetworkManager sends nor the upper-case form
# it also gives ("802_1X", "6LOWPAN") can open a Rust identifier. These say what to call them;
# a third such setting appearing upstream fails generation rather than being mangled silently.
[[setting]]
name = "802-1x"
field = "ieee8021x"

[[setting]]
name = "6lowpan"
# NetworkManager's own device interface for this is `Device.Lowpan`.
field = "lowpan"

