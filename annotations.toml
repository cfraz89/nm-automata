# Type annotations that cannot be read out of the vendored spec.
#
# `just generate` types a property or argument as one of NetworkManager's enumerations
# whenever the upstream documentation says so — through a `Returns:` line, an `@argument`
# entry, or, for single values, a mention in the prose. What is left over goes here.
#
# Every entry is checked: the named type must exist in the vendored headers, and the annotated
# member must exist with a matching D-Bus signature. An entry that no longer applies fails
# generation, so this file cannot rot silently as NetworkManager changes.

# Documented as "See NMCapability for currently defined capability numbers" — prose, and an
# array, which generation does not infer from on its own after `VersionInfo` showed why
# (its elements do not all mean the same thing).
[[property]]
interface = "org.freedesktop.NetworkManager"
name = "Capabilities"
type = "NMCapability"

# Documented only as "The tunneling mode." and "Tunnel flags." — the type is named nowhere,
# so there is nothing to read out of the spec.
[[property]]
interface = "org.freedesktop.NetworkManager.Device.IPTunnel"
name = "Mode"
type = "NMIPTunnelMode"

[[property]]
interface = "org.freedesktop.NetworkManager.Device.IPTunnel"
name = "Flags"
type = "NMIPTunnelFlags"

# Two settings are named so that neither the name NetworkManager sends nor the upper-case form
# it also gives ("802_1X", "6LOWPAN") can open a Rust identifier. These say what to call them;
# a third such setting appearing upstream fails generation rather than being mangled silently.
[[setting]]
name = "802-1x"
field = "ieee8021x"

[[setting]]
name = "6lowpan"
# NetworkManager's own device interface for this is `Device.Lowpan`.
field = "lowpan"

